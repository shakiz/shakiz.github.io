  "Explain modern alternatives to BaseController / BaseViewModel.",
  "Explain repository, use case, service and DI responsibilities.",
  "Explain DIP vs DI, and each SOLID letter through a production example.",
  "Explain single-flight token refresh concurrency.",
  "Explain payment idempotency and the UNKNOWN outcome.",
  "Explain offline-first writes, sync queues and conflict strategies.",
  "Explain Flutter performance profiling and memory investigation.",
  "Explain MethodChannel, EventChannel and FFI.",
  "Explain BLE reconnection as a state machine.",
  "Solve debounce/stale-response, pagination and LRU+TTL cache problems.",
  "Discuss incremental migration of a large codebase.",
  "Handle a production incident scenario end to end.",
  "Defend an architecture with trade-offs rather than preferences.",
  "Give concise answers first; expand only when probed."
];


const CHAPTERS = [...CHAPTERS_A, ...CHAPTERS_B, ...CHAPTERS_C];
const BY_ID = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const ALL = CHAPTERS.flatMap(c => c.items.map(i => ({ ...i, ch: c })));
/* ================= progress store (v3) ================= */
const KEY = 'flutter-interview-guide.v3';
const DAY = 86400000;
let store = { conf:{}, flag:{}, check:{}, theme:null, target:null, sessions:{} };

function dkey(d){ const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); }
const today = () => dkey(new Date());
function parseKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
const daysBetween = (a,b) => Math.round((parseKey(b) - parseKey(a)) / DAY);
function shiftKey(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); }

function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

try { const r = localStorage.getItem(KEY); if (r) store = Object.assign(store, JSON.parse(r)); } catch(e){}
/* one-time migration from the old binary known/flagged model */
try {
  if (!Object.keys(store.conf).length){
    const raw = localStorage.getItem('flutter-interview-guide.v2') || localStorage.getItem('flutter-interview-guide.v1');
    const old = raw ? JSON.parse(raw) : null;
    if (old && old.status){
      const t = today();
      for (const id in old.status){
        if (old.status[id] === 'know') store.conf[id] = { v:3, t };
        else if (old.status[id] === 'review') store.flag[id] = 1;
      }
      if (old.check) store.check = Object.assign({}, old.check, store.check);
      if (old.theme && !store.theme) store.theme = old.theme;
      save();
    }
  }
} catch(e){}
if (store.theme) document.documentElement.setAttribute('data-theme', store.theme);

/* ---- confidence levels, and how fast each one goes stale ---- */
const LEVELS = {
  1: { k:'shaky',   label:'Shaky',         w:0.15, stale:3  },
  2: { k:'getting', label:'Getting there', w:0.55, stale:7  },
  3: { k:'solid',   label:'Solid',         w:1,    stale:14 }
};
const STALE_MULT = 0.5;

const cv     = id => (store.conf[id] && store.conf[id].v) || 0;
const ageOf  = id => store.conf[id] ? daysBetween(store.conf[id].t, today()) : Infinity;
const stale  = id => { const v = cv(id); return v > 0 && ageOf(id) > LEVELS[v].stale; };
const weight = id => { const v = cv(id); return v ? LEVELS[v].w * (stale(id) ? STALE_MULT : 1) : 0; };

const ready       = items => items.length ? Math.round(items.reduce((s,i) => s + weight(i.id), 0) / items.length * 100) : 0;
const countAt     = (items, v) => items.filter(i => cv(i.id) === v).length;
const staleItems  = items => items.filter(i => stale(i.id));
const flagItems   = items => items.filter(i => store.flag[i.id]);
const needsWork   = items => items.filter(i => weight(i.id) < 1);

function setConf(id, v){
  if (cv(id) === v) delete store.conf[id];
  else { store.conf[id] = { v:v, t:today() }; bumpQ(); }
  save();
}
function toggleFlag(id){
  if (store.flag[id]) delete store.flag[id]; else store.flag[id] = 1;
  save();
}

/* ---- study sessions: one bucket per calendar day ---- */
function sessToday(){ const d = today(); return store.sessions[d] || (store.sessions[d] = { q:0, s:0 }); }
function bumpQ(){ sessToday().q++; }

let lastAct = Date.now();
['click','keydown','scroll','touchstart'].forEach(ev =>
  addEventListener(ev, () => { lastAct = Date.now(); }, { passive:true }));
setInterval(() => {
  if (document.hidden || Date.now() - lastAct > 90000) return;
  sessToday().s += 15; save();
}, 15000);

function streakDays(){
  let k = today(), n = 0;
  if (!(store.sessions[k] && store.sessions[k].q)) k = shiftKey(k, -1);
  while (store.sessions[k] && store.sessions[k].q){ n++; k = shiftKey(k, -1); }
  return n;
}
const totalSecs = () => Object.keys(store.sessions).reduce((s,k) => s + (store.sessions[k].s || 0), 0);
const totalQ    = () => Object.keys(store.sessions).reduce((s,k) => s + (store.sessions[k].q || 0), 0);
const fmtDur = s => s < 60 ? s + 's'
  : s < 3600 ? Math.round(s/60) + 'm'
  : Math.floor(s/3600) + 'h ' + String(Math.round(s % 3600 / 60)).padStart(2,'0') + 'm';

/* ---- interview-date plan ---- */
function plan(){
  if (!store.target) return null;
  const left = daysBetween(today(), store.target);
  const pool = needsWork(ALL);
  const days = Math.max(1, left);
  const quota = left < 0 ? 0 : Math.ceil(pool.length / days);
  const chs = CHAPTERS
    .map(c => ({ c:c, n:needsWork(c.items).length, un:countAt(c.items, 0) }))
    .filter(x => x.n)
    .sort((a,b) => b.un - a.un || b.n - a.n)
    .slice(0, 3);
  return { left:left, pool:pool, quota:quota, chs:chs, done:sessToday().q };
}

/* ================= helpers ================= */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const svg = (n, cls) => `<svg class="ic ${cls||''}" viewBox="0 0 24 24">${ICONS[n] || ICONS.roadmap}</svg>`;
const chIcon = c => svg(CH_ICON[c.id] || 'roadmap');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

function answerHTML(it){
  let h = '';
  const fig = DIAGRAMS[it.id];
  if (fig) h += fig;
  if (it.code && !(fig && DIAGRAM_REPLACES_CODE.has(it.id))) h += '<pre>' + esc(it.code) + '</pre>';
  let body = it.a.trim().startsWith('<') ? it.a : '<p>' + it.a + '</p>';
  body = body.replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, '</table></div>');
  return '<div class="ans">' + h + body + '</div>';
}
function ring(pct, size){
  const r = size/2 - 6, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--rule-soft)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--teal)" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct/100)}"/></svg>`;
}
function segBar(items){
  const n = items.length || 1;
  const w = v => (countAt(items, v) / n * 100).toFixed(2) + '%';
  return `<span class="cc-bar">
    <i class="s3" style="width:${w(3)}"></i><i class="s2" style="width:${w(2)}"></i><i class="s1" style="width:${w(1)}"></i></span>`;
}
function ratePills(id){
  const v = cv(id), out = [];
  if (v) out.push(`<span class="pill ${LEVELS[v].k}">${LEVELS[v].label.toLowerCase()}</span>`);
  if (stale(id)) out.push(`<span class="pill stale">needs refresh</span>`);
  if (store.flag[id]) out.push(`<span class="pill flagged">flagged</span>`);
  return out.join('');
}
function rateRow(id, compact){
  return `<div class="rate${compact ? ' compact' : ''}">
    ${compact ? '' : '<span class="rate-l">How solid is this?</span>'}
    ${[1,2,3].map(v => `<button class="cf c${v}" data-conf="${v}" data-id="${id}"
        aria-pressed="${cv(id) === v}">${LEVELS[v].label}</button>`).join('')}
    <button class="flagb" data-flag data-id="${id}" aria-pressed="${!!store.flag[id]}"
      title="Flag to come back to">${svg('flask')}Flag</button>
  </div>`;
}

/* ================= views ================= */
let view = { name:'map' }, idx = 0, shown = false;

function render(){
  if (view.name === 'map') return renderMap();
  if (view.name === 'chapter') return renderChapter();
  if (view.name === 'search') return renderSearch();
  if (view.name === 'checklist') return renderChecklist();
  if (view.name === 'stats') return renderStats();
}

function renderMap(){
  const tot = ALL.length;
  const pct = ready(ALL);
  const s3 = countAt(ALL,3), s2 = countAt(ALL,2), s1 = countAt(ALL,1), s0 = countAt(ALL,0);
  const st = staleItems(ALL).length, fl = flagItems(ALL).length;
  const resume = CHAPTERS.find(c => needsWork(c.items).length);
  const strk = streakDays(), sec = sessToday().s, p = plan();

  const rows = [
    { k:'s3', label:'Solid',         n:s3 }, { k:'s2', label:'Getting there', n:s2 },
    { k:'s1', label:'Shaky',         n:s1 }, { k:'s0', label:'Untouched',     n:s0 }
  ].map(r => `<div class="cr">
      <span class="cr-l"><i class="sw ${r.k}"></i>${r.label}</span>
      <span class="cr-bar"><i class="${r.k}" style="width:${(r.n/tot*100).toFixed(2)}%"></i></span>
      <span class="cr-n">${r.n}</span></div>`).join('');

  app.innerHTML = `
  <section class="hero">
    <div>
      <h1>Work through it, don't read it.</h1>
      <p>Rate every answer by how solid it actually felt. Ratings fade as they age, so the score below is what you could defend today — not what you once clicked through.</p>
      <div class="cta">
        ${resume ? `<button class="tbtn solid" data-open="${resume.id}">${svg('bolt')}<span class="trunc">Continue &middot; ${String(resume.n).padStart(2,'0')} ${esc(resume.title.split('—')[0].trim())}</span></button>` : ''}
        ${st ? `<button class="tbtn warn" id="drill-stale">${svg('clock')}Refresh ${st} stale</button>` : ''}
        ${s1 ? `<button class="tbtn" id="drill-shaky">${svg('flask')}Drill ${s1} shaky</button>` : ''}
        ${fl ? `<button class="tbtn" id="drill-flag">${svg('flask')}Drill ${fl} flagged</button>` : ''}
      </div>
    </div>
    <div class="ring">${ring(pct, 132)}<div class="rv">
      <div class="rp">${pct}%</div><div class="rl">readiness</div></div></div>
  </section>

  <section class="pboard">
    <div class="pb-col">
      <div class="pb-head"><h2>Where you stand</h2>
        <p>${plural(s3 + s2 + s1, 'answer')} rated of ${tot}${st ? ` · ${st} gone stale` : ''}</p></div>
      <div class="conf-rows">${rows}</div>
      ${st ? `<button class="pb-note" id="drill-stale-2">${svg('clock')}
        <span><strong>${plural(st, 'rating')} ${st === 1 ? 'has' : 'have'} gone stale.</strong>
        Solid fades after 14 days, getting-there after 7, shaky after 3.</span>
        <span class="go">Refresh${svg('fwd')}</span></button>` : ''}
    </div>

    <div class="pb-col side">
      <div class="pb-head"><h2>Habit</h2><p>Kept in this browser.</p></div>
      <div class="chips">
        <span class="chip ${strk ? 'on' : ''}">${svg('bolt')}${strk
          ? `<b>${strk}</b> day${strk === 1 ? '' : 's'} in a row`
          : 'no streak yet'}</span>
        <span class="chip">${svg('clock')}<b>${fmtDur(sec)}</b> today</span>
        <span class="chip">${svg('check')}<b>${sessToday().q}</b> rated today</span>
      </div>
      <button class="pb-link" data-stats>${svg('chart')}See full history${svg('fwd')}</button>

      <div class="pb-head tight"><h2>Interview date</h2></div>
      ${p ? `<div class="cdown ${p.left < 0 ? 'past' : p.left <= 3 ? 'soon' : ''}">
          <div class="cd-n">${p.left < 0 ? 'Done' : p.left === 0 ? 'Today' : p.left}</div>
          <div class="cd-l">${p.left < 0 ? 'that date has passed' : p.left === 0 ? 'good luck' : p.left === 1 ? 'day to go' : 'days to go'}
            <span>${esc(store.target)}</span></div>
          <button class="cd-x" data-cleartarget title="Clear date">&times;</button>
        </div>
        ${p.left >= 0 && p.pool.length ? `<div class="planbox">
          <div class="plan-top"><span>Today's plan</span>
            <b>${Math.min(p.done, p.quota)} / ${p.quota}</b></div>
          <span class="plan-bar"><i style="width:${p.quota ? Math.min(100, p.done / p.quota * 100) : 100}%"></i></span>
          <p class="plan-k">${plural(p.pool.length, 'question')} still below solid${p.left > 0 ? ` · ${p.quota} a day clears it` : ''}.</p>
          <div class="plan-ch">${p.chs.map(x => `<button data-open="${x.c.id}">
            <span class="pn">${String(x.c.n).padStart(2,'0')}</span>
            <span class="pt">${esc(x.c.title.split('—')[0].trim())}</span>
            <span class="pl">${x.n} left</span></button>`).join('')}</div>
        </div>` : p.left >= 0 ? `<p class="plan-k done">Every question is solid and fresh. Skim the checklist and sleep.</p>` : ''}`
      : `<p class="plan-k">Set the date and this turns into a per-day quota over whatever is still below solid.</p>
         <label class="setdate">${svg('clock')}<input type="date" id="target" min="${today()}" aria-label="Interview date"></label>`}
    </div>
  </section>

  ${GROUPS.map(g => `
    <section class="group">
      <div class="ghead"><h2>${g.label}</h2><p>${g.note}</p></div>
      <div class="cards">${g.chapters.map(id => card(BY_ID[id])).join('')}</div>
    </section>`).join('')}

  <section class="group">
    <div class="ghead"><h2>Before you go in</h2><p>The night-before pass.</p></div>
    <div class="cards">
      <button class="cc" data-checklist>
        <span class="cc-top"><span class="cc-ico">${svg('check')}</span><span class="cc-n">23</span></span>
        <h3>Final preparation checklist</h3>
        <span class="cc-k">Nineteen things you should be able to explain aloud. Tick them off the night before.</span>
        <span class="cc-foot"><span class="cc-bar"><i class="s3" style="width:${Math.round(CHECKLIST.filter((_,i)=>store.check[i]).length/CHECKLIST.length*100)}%"></i></span>
        <span class="cc-m">${CHECKLIST.filter((_,i)=>store.check[i]).length} / ${CHECKLIST.length}</span></span>
      </button>
    </div>
  </section>

  <div class="foot"><span>Progress is saved in this browser only.</span>
    <button data-stats>History</button><button id="reset">Reset progress</button></div>`;
}

function card(c){
  const n = c.items.length, pct = ready(c.items);
  const st = staleItems(c.items).length, fl = flagItems(c.items).length;
  return `<button class="cc ${pct === 100 ? 'full' : ''} ${st ? 'stale' : ''}" data-open="${c.id}">
    <span class="cc-top"><span class="cc-ico">${chIcon(c)}</span>
      ${st ? `<span class="dot st" title="${plural(st,'rating')} gone stale"></span>` : ''}
      ${fl ? `<span class="dot" title="${plural(fl,'question')} flagged"></span>` : ''}
      <span class="cc-n">${String(c.n).padStart(2,'0')}</span></span>
    <h3>${esc(c.title)}</h3>
    <span class="cc-k">${esc(c.kicker)}</span>
    <span class="cc-foot">${segBar(c.items)}<span class="cc-m">${pct}%</span></span>
  </button>`;
}

function renderChapter(){
  const c = view.ch, n = c.items.length;
  const st = staleItems(c.items).length, fl = flagItems(c.items).length;
  const head = `
    <div class="crumb">
      <button data-home>${svg('bank')}All chapters</button>
      <span class="sp"></span>
      <button data-mode="${view.list ? 'card' : 'list'}">${view.list ? 'Guided cards' : 'Browse all'}</button>
    </div>
    <div class="chead">
      <span class="big">${chIcon(c)}</span>
      <div><div class="lbl">Chapter ${String(c.n).padStart(2,'0')} · ${n} questions · ${ready(c.items)}% ready${st ? ` · ${st} stale` : ''}</div>
        <h2>${esc(c.title)}</h2><p>${esc(c.kicker)}</p></div>
    </div>`;

  if (view.list){
    app.innerHTML = `<div class="chv">${head}<div class="list">${c.items.map((it,i) => `
      <div class="li" data-c="${cv(it.id)}" data-stale="${stale(it.id) ? 1 : 0}" data-flag="${store.flag[it.id] ? 1 : 0}">
        <button data-card="${i}"><span class="n">${it.id}</span><span>${esc(it.q)}</span>
          <span class="li-tag">${ratePills(it.id)}</span></button>
      </div>`).join('')}</div></div>`;
    return;
  }

  if (idx >= n){
    const pct = ready(c.items), next = CHAPTERS[CHAPTERS.indexOf(c) + 1];
    app.innerHTML = `<div class="chv">${head}
      <div class="done"><div class="big">${svg('check')}</div>
        <h3>End of the chapter</h3>
        <p>${pct}% ready — ${countAt(c.items,3)} solid, ${countAt(c.items,2)} getting there, ${countAt(c.items,1)} shaky, ${countAt(c.items,0)} unrated${fl ? `, ${fl} flagged` : ''}.</p>
        <div class="cta">
          ${needsWork(c.items).length ? `<button class="tbtn" data-drill-weak="${c.id}">Drill the ${needsWork(c.items).length} weak ones</button>` : ''}
          ${fl ? `<button class="tbtn" data-drill-ch="${c.id}">Drill the flagged</button>` : ''}
          <button class="tbtn" data-card="0">Start over</button>
          ${next ? `<button class="tbtn solid" data-open="${next.id}">Next: ${esc(next.title.split('—')[0].trim())}</button>` : `<button class="tbtn solid" data-home>Back to chapters</button>`}
        </div></div></div>`;
    return;
  }

  const it = c.items[idx];
  app.innerHTML = `<div class="chv">${head}
    <div class="track">${c.items.map((x,i) =>
      `<button data-card="${i}" class="${i===idx?'now':''}${DIAGRAMS[x.id]?' hasfig':''}" data-c="${cv(x.id)}" data-stale="${stale(x.id)?1:0}" aria-label="Question ${i+1}${DIAGRAMS[x.id]?' (has a diagram)':''}"></button>`).join('')}</div>
    <article class="card">
      <span class="wm">${chIcon(c)}</span>
      <div class="card-top">
        <span class="step">${it.id} · question ${idx+1} of ${n}</span>
        ${DIAGRAMS[it.id] ? '<span class="pill fig">diagram</span>' : ''}
        ${it.added ? '<span class="pill new">new</span>' : ''}
        ${ratePills(it.id)}
        ${cv(it.id) ? `<span class="agetag">rated ${ageOf(it.id) === 0 ? 'today' : plural(ageOf(it.id),'day') + ' ago'}</span>` : ''}
      </div>
      <h3 class="cq">${esc(it.q)}</h3>
      ${shown ? answerHTML(it)
              : `<button class="showbtn" id="show">${svg('ask')}Show answer</button>`}
      ${rateRow(it.id)}
      <div class="acts">
        <button class="pv" data-card="${idx-1}" ${idx===0?'disabled style="opacity:.4"':''}>${svg('back')}Back</button>
        <span class="sp"></span>
        <button class="nx" data-card="${idx+1}">${idx+1===n?'Finish':'Next'}${svg('fwd')}</button>
      </div>
    </article>
    <div class="kbd">space reveal · → next · ← back · 1 shaky · 2 getting there · 3 solid · f flag</div>
  </div>`;
}

function renderSearch(){
  const t = view.term.toLowerCase();
  const hits = ALL.filter(i => (i.q + ' ' + i.a + ' ' + (i.code||'') + ' ' + i.ch.title).toLowerCase().includes(t)).slice(0, 60);
  app.innerHTML = `<div class="sres">
    <h2>${hits.length} result${hits.length===1?'':'s'}</h2>
    <p class="meta">Searching questions, answers, code and chapter titles for “${esc(view.term)}”.</p>
    ${hits.length ? hits.map(i => `<button class="sr" data-goto="${i.id}">
        <span class="top">${chIcon(i.ch)} ${String(i.ch.n).padStart(2,'0')} · ${esc(i.ch.title)} · ${i.id}
          ${ratePills(i.id)}</span>
        <span class="q">${esc(i.q)}</span></button>`).join('')
      : `<div class="none">Nothing matched. Try a shorter term — “idempotency”, “isolate”, “keys”.</div>`}
  </div>`;
}

function renderChecklist(){
  app.innerHTML = `<div class="chv">
    <div class="crumb"><button data-home>${svg('bank')}All chapters</button></div>
    <div class="chead"><span class="big">${svg('check')}</span>
      <div><div class="lbl">Chapter 23 · ${CHECKLIST.filter((_,i)=>store.check[i]).length} of ${CHECKLIST.length} ticked</div>
      <h2>Final preparation checklist</h2><p>If you can't explain one of these aloud, go back to its chapter.</p></div></div>
    <div class="ckl">${CHECKLIST.map((t,i) =>
      `<label><input type="checkbox" data-check="${i}" ${store.check[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div>
  </div>`;
}

function renderStats(){
  const days = 84;
  let cells = '', best = 0;
  for (let i = days - 1; i >= 0; i--){
    const k = shiftKey(today(), -i), q = (store.sessions[k] || {}).q || 0;
    best = Math.max(best, q);
    const lv = q === 0 ? 0 : q < 6 ? 1 : q < 16 ? 2 : q < 31 ? 3 : 4;
    cells += `<i class="l${lv}" title="${k} · ${plural(q,'rating')}"></i>`;
  }
  const recent = Object.keys(store.sessions).filter(k => store.sessions[k].q || store.sessions[k].s)
    .sort().reverse().slice(0, 8);
  const chRows = CHAPTERS.map(c => ({ c:c, pct:ready(c.items) })).sort((a,b) => a.pct - b.pct);

  app.innerHTML = `<div class="chv">
    <div class="crumb"><button data-home>${svg('bank')}All chapters</button></div>
    <div class="chead"><span class="big">${svg('chart')}</span>
      <div><div class="lbl">Study history · this browser only</div>
      <h2>How the prep is going</h2><p>Ratings, time on the page, and which chapters are still weakest.</p></div></div>

    <div class="chips big">
      <span class="chip ${streakDays() ? 'on' : ''}">${svg('bolt')}${streakDays()
        ? `<b>${streakDays()}</b> day${streakDays() === 1 ? '' : 's'} in a row`
        : 'no streak yet'}</span>
      <span class="chip">${svg('clock')}<b>${fmtDur(totalSecs())}</b> total</span>
      <span class="chip">${svg('check')}<b>${totalQ()}</b> ratings made</span>
      <span class="chip">${svg('chart')}<b>${ready(ALL)}%</b> ready</span>
    </div>

    <div class="stat-sec"><h3>Last 12 weeks</h3>
      <div class="heat">${cells}</div>
      <div class="heat-l"><span>12 weeks ago</span><span class="sp"></span>
        <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>
        <span>${best ? 'up to ' + best + '/day' : 'nothing yet'}</span></div></div>

    <div class="stat-two">
      <div class="stat-sec"><h3>Recent sessions</h3>
        ${recent.length ? `<div class="sess">${recent.map(k => `<div class="se">
            <span class="sd">${k === today() ? 'Today' : k === shiftKey(today(),-1) ? 'Yesterday' : k}</span>
            <span class="sq">${plural(store.sessions[k].q || 0,'rating')}</span>
            <span class="ss">${fmtDur(store.sessions[k].s || 0)}</span></div>`).join('')}</div>`
          : `<p class="plan-k">No sessions recorded yet — rate an answer and this fills in.</p>`}</div>

      <div class="stat-sec"><h3>Weakest chapters first</h3>
        <div class="chlist">${chRows.map(r => `<button data-open="${r.c.id}">
          <span class="cn">${String(r.c.n).padStart(2,'0')}</span>
          <span class="ct">${esc(r.c.title.split('—')[0].trim())}</span>
          ${segBar(r.c.items)}<span class="cp">${r.pct}%</span></button>`).join('')}</div></div>
    </div>

    <div class="foot"><span>Nothing here leaves your browser.</span>
      <button id="reset">Reset progress</button></div>
  </div>`;
}

/* ================= navigation ================= */
function openChapter(id, at){
  const c = BY_ID[id]; if (!c) return;
  view = { name:'chapter', ch:c, list:false };
  if (at !== undefined) idx = at;
  else { const f = c.items.findIndex(i => weight(i.id) < 1); idx = f < 0 ? 0 : f; }
  shown = false; render(); scrollTo({ top:0, behavior:'instant' });
}
function goto(itemId){
  const it = ALL.find(x => x.id === itemId); if (!it) return;
  openChapter(it.ch.id, it.ch.items.findIndex(x => x.id === itemId));
  shown = true; render();
}
function home(){ view = { name:'map' }; document.getElementById('q').value = ''; render(); scrollTo({top:0,behavior:'instant'}); }
function stats(){ view = { name:'stats' }; render(); scrollTo({top:0,behavior:'instant'}); }

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-home]') || t.closest('#home')) return home();
  if (t.closest('[data-stats]') || t.closest('#btn-stats')) return stats();
  const open = t.closest('[data-open]'); if (open) return openChapter(open.dataset.open);
  if (t.closest('[data-checklist]')){ view = { name:'checklist' }; render(); scrollTo({top:0,behavior:'instant'}); return; }
  const gt = t.closest('[data-goto]'); if (gt) return goto(gt.dataset.goto);
  const md = t.closest('[data-mode]'); if (md){ view.list = md.dataset.mode === 'list'; shown = false; render(); return; }

  const fg = t.closest('[data-flag]');
  if (fg){
    toggleFlag(fg.dataset.id);
    if (view.name === 'chapter' && view.list){
      const li = fg.closest('.li');
      li.dataset.flag = store.flag[fg.dataset.id] ? 1 : 0;
      fg.setAttribute('aria-pressed', String(!!store.flag[fg.dataset.id]));
      li.querySelector('.li-tag').innerHTML = ratePills(fg.dataset.id);
      return;
    }
    render(); return;
  }

  const cf = t.closest('[data-conf]');
  if (cf){
    const id = cf.dataset.id, v = +cf.dataset.conf, had = cv(id) === v;
    setConf(id, v);
    if (view.name === 'chapter' && view.list){
      const li = cf.closest('.li');
      li.dataset.c = cv(id); li.dataset.stale = stale(id) ? 1 : 0;
      li.querySelectorAll('[data-conf]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.conf === cv(id))));
      li.querySelector('.li-tag').innerHTML = ratePills(id);
      return;
    }
    if (!had){ idx++; shown = false; }
    render(); scrollTo({top:0,behavior:'smooth'}); return;
  }

  const cd = t.closest('[data-card]');
  if (cd){
    const i = +cd.dataset.card;
    if (view.list){
      const li = cd.closest('.li'), it = view.ch.items[i];
      const open = li.querySelector('.body');
      if (open){ open.remove(); return; }
      const d = document.createElement('div'); d.className = 'body';
      d.innerHTML = answerHTML(it) + rateRow(it.id, true);
      li.appendChild(d); return;
    }
    if (i < 0) return;
    idx = i; shown = false; render(); scrollTo({top:0,behavior:'smooth'}); return;
  }

  if (t.closest('#show')){ shown = true; render(); return; }
  if (t.closest('[data-cleartarget]')){ store.target = null; save(); render(); return; }
  if (t.closest('#reset')){
    if (confirm('Clear every rating, session and checklist tick?')){
      store.conf = {}; store.flag = {}; store.check = {}; store.sessions = {}; store.target = null;
      save(); render();
    } return;
  }
  if (t.closest('#drill-flag'))  return startDrill(flagItems(ALL), 'flagged');
  if (t.closest('#drill-stale') || t.closest('#drill-stale-2')) return startDrill(staleItems(ALL), 'stale');
  if (t.closest('#drill-shaky')) return startDrill(ALL.filter(i => cv(i.id) === 1), 'shaky');
  const dc = t.closest('[data-drill-ch]');
  if (dc) return startDrill(flagItems(BY_ID[dc.dataset.drillCh].items), 'flagged');
  const dw = t.closest('[data-drill-weak]');
  if (dw) return startDrill(needsWork(BY_ID[dw.dataset.drillWeak].items), 'weak');
});

document.addEventListener('change', e => {
  const c = e.target.closest('[data-check]');
  if (c){ store.check[c.dataset.check] = c.checked; save(); return; }
  const tg = e.target.closest('#target');
  if (tg && tg.value){ store.target = tg.value; save(); render(); }
});

let tmr;
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim();
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    if (!v){ if (view.name === 'search') home(); return; }
    view = { name:'search', term:v }; render();
  }, 160);
});

document.getElementById('btn-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next); store.theme = next; save();
});

/* ================= drill ================= */
const drill = document.getElementById('drill');
const EMPTY = { flagged:'Nothing flagged yet.', stale:'Nothing has gone stale yet.',
                shaky:'Nothing is rated shaky.', weak:'Every question here is solid and fresh.' };
let deck = [], dpos = 0, drev = false;

function startDrill(pool, what){
  if (what && (!pool || !pool.length)) return alert(EMPTY[what] || 'Nothing to drill.');
  deck = (pool && pool.length ? pool : ALL).slice().sort(() => Math.random() - .5);
  dpos = 0; drill.hidden = false; document.body.style.overflow = 'hidden'; dcard();
}
function dcard(){
  const it = deck[dpos]; drev = false;
  document.getElementById('d-pos').textContent = (dpos+1) + ' / ' + deck.length;
  document.getElementById('d-prog').style.width = (dpos / deck.length * 100) + '%';
  document.getElementById('d-src').innerHTML = chIcon(it.ch) + ' ' + esc(it.ch.title) + ' · ' + it.id + ratePills(it.id);
  document.getElementById('d-q').textContent = it.q;
  const a = document.getElementById('d-a'); a.innerHTML = answerHTML(it); a.hidden = true;
  document.getElementById('d-reveal').textContent = 'Show answer';
  document.getElementById('d-flag').setAttribute('aria-pressed', String(!!store.flag[it.id]));
  [1,2,3].forEach(v => document.getElementById('d-c'+v).setAttribute('aria-pressed', String(cv(it.id) === v)));
  document.querySelector('.dbody').scrollTop = 0;
}
function dnext(){
  if (dpos + 1 >= deck.length){ dclose(); alert('Deck finished — ' + plural(deck.length, 'card') + '.'); return; }
  dpos++; dcard();
}
function dreveal(){ drev = true; document.getElementById('d-a').hidden = false; document.getElementById('d-reveal').textContent = 'Next card'; }
function drate(v){ setConf(deck[dpos].id, v); dnext(); }
function dflag(){ const it = deck[dpos]; toggleFlag(it.id);
  document.getElementById('d-flag').setAttribute('aria-pressed', String(!!store.flag[it.id])); }
function dclose(){ drill.hidden = true; document.body.style.overflow = ''; render(); }

document.getElementById('btn-drill').addEventListener('click', () => startDrill(ALL));
document.getElementById('d-reveal').addEventListener('click', () => drev ? dnext() : dreveal());
[1,2,3].forEach(v => document.getElementById('d-c'+v).addEventListener('click', () => drate(v)));
document.getElementById('d-flag').addEventListener('click', dflag);
document.getElementById('d-skip').addEventListener('click', dnext);
document.getElementById('d-close').addEventListener('click', dclose);

addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (!drill.hidden){
    if (e.key === 'Escape') return dclose();
    if (e.key === ' '){ e.preventDefault(); return drev ? dnext() : dreveal(); }
    if (e.key === '1') return drate(1);
    if (e.key === '2') return drate(2);
    if (e.key === '3') return drate(3);
    if (e.key === 'f' || e.key === 'F') return dflag();
    return;
  }
  if (view.name !== 'chapter' || view.list) return;
  const it = view.ch.items[idx];
  if (e.key === ' '){ e.preventDefault(); if (!shown){ shown = true; render(); } return; }
  if (e.key === 'ArrowRight'){ idx++; shown = false; render(); return; }
  if (e.key === 'ArrowLeft' && idx > 0){ idx--; shown = false; render(); return; }
  if (it && (e.key === 'f' || e.key === 'F')){ toggleFlag(it.id); render(); return; }
  if (it && (e.key === '1' || e.key === '2' || e.key === '3')){
    setConf(it.id, +e.key); idx++; shown = false; render(); return;
  }
});

document.getElementById('q').placeholder = 'Search ' + ALL.length + ' questions…';
render();
</script>
</body>
</html>
