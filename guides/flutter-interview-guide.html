    { id: "5.3", q: "Screen 1 → Screen 2 → Screen 3. Screen 3 needs to update Screen 1. How?",
      a: "First decide which of two different problems this is. If Screen 3 only needs to report an outcome — 'saved' — that's a <strong>navigation result</strong>, and the answer is one line. If several screens need to observe the same live business state, that's a <strong>shared state owner scoped above all three</strong>, with the Navigator underneath it. What you never do is call Screen 1 directly from Screen 3. And if Screen 1 was disposed while away, it must be able to read current state on return — which is an argument for the state living above it, not inside it.",
      code: "// one-off outcome\nfinal updated = await Navigator.push(...);\nif (updated == true) refresh();\n\n// shared reactive state\nFeatureScope\n  ├── FeatureCubit\n  └── Navigator\n        ├── Screen 1\n        ├── Screen 2\n        └── Screen 3" },
    { id: "5.4", q: "Two screens are unrelated in the widget tree but share business data — say Home and Payment both show balance. What now?",
      a: "Establish a state owner above both with an explicit lifecycle — a <code>BalanceCubit</code> provided at the authenticated-session scope — and let both screens observe it. Do not thread the value through navigation arguments just because the widget tree doesn't connect them; that makes every intermediate route a courier for data it doesn't care about, and it goes stale the moment anything else changes the balance." },
    { id: "5.5", q: "When is a plain setState still the right answer?",
      a: "When the state is genuinely widget-local and dies with the widget: a text field's controller, an expansion toggle, an animation value, a form's validation flag. Reaching for a Cubit here adds indirection, a provider, a lifecycle question and a test file to protect a boolean. Seniority shows in <em>not</em> escalating.", added: true },
    { id: "5.6", q: "Cubit vs BLoC — how do you choose?",
      a: "Cubit exposes methods and emits states; BLoC takes an event stream in and emits states out. Use Cubit by default — it's less ceremony and reads better. Reach for BLoC when you genuinely need the event stream as a first-class thing: event transformers (debounce, throttle, <code>concurrent</code> vs <code>droppable</code> vs <code>restartable</code>), an audit trail of what the user did, or complex ordering guarantees between actions. 'Events give me a log and transformers' is the honest reason; 'BLoC is more architectural' is not.", added: true },
    { id: "5.7", q: "Why does state equality matter in BLoC/Cubit, and how do you get it right?",
      a: "<code>emit</code> is a no-op if the new state <code>==</code> the old one, and listeners rebuild when it isn't. So mutating a list in place and re-emitting the same instance silently drops the update, while emitting a fresh-but-equivalent object with default identity equality causes needless rebuilds. Fix it with value equality — Equatable or freezed — and treat state objects as immutable, always constructing a new one with <code>copyWith</code>.", added: true },
    { id: "5.8", q: "How should you model a screen's state — flags or a sealed type?",
      a: "Prefer a sealed/union type over a bag of booleans. <code>isLoading</code>, <code>error</code> and <code>data</code> as three independent fields allows sixteen combinations, most of which are nonsense and at least one of which you will render by accident. A sealed hierarchy makes the illegal states unrepresentable and lets the compiler force you to handle every branch in an exhaustive switch.",
      code: "sealed class SearchState {}\nfinal class SearchIdle    extends SearchState {}\nfinal class SearchLoading extends SearchState {}\nfinal class SearchData    extends SearchState { final List<Item> items; SearchData(this.items); }\nfinal class SearchFailed  extends SearchState { final AppError e; SearchFailed(this.e); }\n\n// exhaustive — the compiler catches a missing branch\nWidget build(BuildContext c) => switch (state) {\n  SearchIdle()      => const Hint(),\n  SearchLoading()   => const Spinner(),\n  SearchData(:final items) => ResultList(items),\n  SearchFailed(:final e)   => ErrorView(e),\n};", added: true },
    { id: "5.9", q: "How do you handle one-off effects — a toast, a navigation — in a state-based architecture?",
      a: "They aren't state, so don't store them in state; a state object that carries <code>navigateToReceipt: true</code> will re-fire on the next rebuild or on restore. Model them as a separate single-consumption channel: a stream of effects the widget listens to, or <code>BlocListener</code> which fires on transitions rather than on builds. The distinction is the same one as event vs state: an effect describes something that happened once.", added: true }
  ]
},
{
  n: 6, id: "basecontroller", title: "Replacing BaseController / BaseViewModel",
  kicker: "Why the shared base class rots, and what a shared capability looks like instead.",
  items: [
    { id: "6.1", q: "What goes wrong with a BaseController that holds API, logger, analytics, storage, loading and error handling?",
      a: "Four things. It <strong>hides dependencies</strong> — you cannot tell from a subclass's signature what it actually touches. It <strong>accretes</strong> — unrelated functionality accumulates because the base class is the path of least resistance. It <strong>hurts testing and ownership</strong> — every test drags in the whole graph, and no one owns the base. And it turns <strong>inheritance into a coupling mechanism</strong> rather than a useful abstraction: subclasses are bound to each other's changes through a parent none of them chose." },
    { id: "6.2", q: "Five features need the user's KYC status. Where does that live?",
      a: "Treat KYC as a domain capability, not a method on a base class. <code>KycRepository</code> is the data boundary coordinating remote API and local cache. Add a <code>GetKycStatus</code> use case only if there are real business rules — evaluate eligibility, derive a decision — rather than a pass-through. If features need to <em>react</em> to changes, put a <code>KycCubit</code> at the authenticated scope and let them observe it. Crucially, separate <em>reading current KYC state</em> from <em>fetching it from the server</em>: those are different operations with different costs.",
      code: "         KycRepository\n        /            \\\n   Remote API     Local Cache\n         \\            /\n          GetKycStatus\n               |\n            KycCubit\n         /     |      \\\n      Home  Payment  Profile" },
    { id: "6.3", q: "Five screens each call the KYC endpoint on open. How do you get to one call?",
      a: "Cache according to freshness and security requirements — KYC status tolerates a short TTL, a balance may not. Deduplicate simultaneous in-flight requests so five concurrent opens share one network call. Keep the server authoritative for anything that gates money or access. And clear all user-scoped cache on logout or session change, or the next user sees the last one's data." },
    { id: "6.4", q: "Isn't a single global AppCubit with auth, KYC, balance, profile, notifications and settings the pragmatic answer?",
      a: "No — that is a BaseController wearing a different hat. Any change to notifications invalidates the state object that the payment screen observes, ownership becomes collective (so nobody's), and the lifecycle is wrong because those concerns do not all live and die together. Split by business ownership and lifecycle. Global scope is a lifecycle decision, not a convenience shortcut." },
    { id: "6.5", q: "Is a base class ever justified?",
      a: "Yes, and saying so is the mature answer. A base class is fine when it represents a genuine shared abstraction whose subtypes really are substitutable for it — a <code>PaymentProcessor</code>, a <code>SyncOperation</code>. It's wrong when it exists to give subclasses convenient access to unrelated services. The test: does the parent express behaviour every child truly is, or does it express a set of things every child happens to need? The second case is what dependency injection is for." }
  ]
},
{
  n: 7, id: "architecture", title: "Architecture — Composition, DI & Boundaries",
  kicker: "What each layer owes the others, and what it must never do.",
  items: [
    { id: "7.1", q: "Sketch the layering and say what each component must avoid.",
      code: "Presentation\n    ↓\nFeature State (Cubit / BLoC)\n    ↓\nUse Case (when useful)\n    ↓\nRepository\n    ↓\nLocal / Remote Data Sources",
      a: "<table><tr><th>Component</th><th>Responsibility</th><th>Avoid</th></tr><tr><td>State holder</td><td>UI-facing state and orchestration</td><td>Raw networking</td></tr><tr><td>Use case</td><td>A meaningful business operation</td><td>One-line pass-through ceremony</td></tr><tr><td>Repository</td><td>Data access and source coordination</td><td>UI-specific logic</td></tr><tr><td>API client</td><td>Transport concerns</td><td>Business decisions</td></tr><tr><td>DI</td><td>Composition and lifecycle</td><td>Hidden dependencies</td></tr></table>" },
    { id: "7.2", q: "When is a use case worth the file?",
      a: "When it expresses business behaviour that doesn't belong to any single repository: fetch KYC → evaluate eligibility against the requested product → return a domain decision. If it only forwards one repository call with the same signature, it is ceremony — it adds a file, a mock and an indirection while protecting nothing." },
    { id: "7.3", q: "Repository vs DataSource vs Service — draw the lines.",
      a: "A <strong>DataSource</strong> speaks to one concrete source: a REST client, a SQLite DAO, a cache, a platform API. A <strong>Repository</strong> exposes domain-shaped operations and coordinates sources — cache-then-network, mapping DTOs to domain models, deciding what's authoritative. <strong>Service</strong> is the weakest of the three names: if you can't say what boundary it owns, that's a signal the class has no clear responsibility, not that it needs a better name." },
    { id: "7.4", q: "Event bus or state? How do you decide?",
      a: "<table><tr><th>Need</th><th>Prefer</th><th>Why</th></tr><tr><td>Current KYC status</td><td>Reactive state</td><td>Consumers need the current value</td></tr><tr><td>Payment progress</td><td>State machine</td><td>It must be observable and resumable</td></tr><tr><td>One-time global notification</td><td>Event mechanism</td><td>Genuinely transient</td></tr><tr><td>Edit → save → return</td><td>Navigation result</td><td>Simple local communication</td></tr></table><p>The distinction to say out loud: <strong>events describe something that happened; state describes what is true now.</strong> An event bus used as a source of truth is a symptom of missing state ownership — a late subscriber has no way to learn the current value.</p>" },
    { id: "7.5", q: "How do you decide module boundaries in a large Flutter codebase?",
      a: "By business capability and by rate of change, not by technical layer. <code>feature_payments</code>, <code>feature_kyc</code>, <code>core_network</code>, <code>design_system</code> beats <code>widgets</code>, <code>models</code>, <code>services</code> — the latter forces every feature change to touch every folder. Enforce direction with package boundaries so features can depend on core but never on each other; cross-feature needs go through a shared contract package. The win is compile-time enforcement of the architecture diagram instead of a wiki page nobody reads.", added: true },
    { id: "7.6", q: "How do you handle navigation as an architectural concern?",
      a: "Keep route definitions declarative and centralised (go_router or equivalent) so deep links, web URLs and auth redirects are one concern rather than scattered <code>Navigator.push</code> calls. Make auth gating a redirect driven by session state rather than a check inside each screen. Keep the state layer free of <code>BuildContext</code>: a Cubit should emit 'payment succeeded', and the widget layer should decide that this means pushing the receipt route.", added: true }
  ]
},
{
  n: 8, id: "solid", title: "SOLID, Dependency Injection & Dependency Inversion",
  kicker: "Principles as tools for controlling coupling — not as a checklist of interfaces to create.",
  items: [
    { id: "8.1", q: "Dependency Injection vs Dependency Inversion — what's the actual difference?",
      a: "<strong>Dependency Inversion (DIP)</strong> is a design principle about <em>direction</em>: high-level policy should not depend on low-level implementation detail; both should depend on an abstraction. <strong>Dependency Injection (DI)</strong> is a <em>technique</em> for supplying a dependency from outside rather than letting the object construct or locate it. One is about which way the arrow points; the other is about how the object gets handed its collaborators." },
    { id: "8.2", q: "Can you have DI without DIP?",
      a: "Yes, and it's common. <code>LoginCubit(FirebaseAuth auth)</code> is constructor injection — that's DI. But the presentation layer now depends directly on a concrete external technology, so DIP is violated: swapping auth providers or testing without Firebase means changing the Cubit. Inject an <code>AuthRepository</code> contract instead and you have both." },
    { id: "8.3", q: "Can you have DIP without GetIt or any container?",
      a: "Yes. Manual constructor wiring at the top of the app satisfies DIP completely. A container is a convenience for assembling a large object graph and managing lifetimes; it is not what makes the dependency direction correct. Many small apps are better off without one." },
    { id: "8.4", q: "Is GetIt dependency injection?",
      a: "Strictly, GetIt is a <strong>service locator</strong>: objects ask it for what they need. It becomes good architecture when you use it only at the composition root to build objects, while the business classes themselves take dependencies through their constructors. A <code>getIt&lt;PaymentRepository&gt;()</code> call buried inside a Cubit is a hidden global dependency — invisible in the type signature and awkward to replace in a test." },
    { id: "8.5", q: "S — Single Responsibility. What's the misreading?",
      a: "That it means one method per class. It means one cohesive responsibility, i.e. one reason to change. A <code>PaymentCubit</code> that validates cards, calls APIs, writes to the database, generates PDF receipts and fires analytics has five unrelated reasons to change, and five teams touching it. Keep UI-state orchestration in the Cubit and delegate rules, persistence, receipts and analytics to collaborators." },
    { id: "8.6", q: "O — Open/Closed. Does it mean never modifying existing code?",
      a: "No. It means creating stable extension points where variation is genuinely expected. Rather than growing an if/else chain for card, bKash, Nagad and whatever comes next, define a <code>PaymentProcessor</code> contract and add an implementation per method. The staff-level caveat: don't manufacture an abstraction to satisfy OCP when there is no real extension point — speculative pluggability is a cost with no payer." },
    { id: "8.7", q: "L — Liskov. Give a concrete Flutter/Dart violation.",
      a: "<code>PaymentMethod</code> declares <code>refund()</code>, and <code>CashPayment</code> implements it by throwing <code>UnsupportedError</code>. Every caller now has to know the concrete type to use the base type safely, which defeats the abstraction. The fix is to model capability honestly — a separate <code>Refundable</code> interface that only refundable methods implement — rather than forcing subtypes to pretend." },
    { id: "8.8", q: "I — Interface Segregation. What does it look like in a real app?",
      a: "A single <code>UserRepository</code> carrying login, logout, KYC, profile upload and transaction history forces the login screen to depend on transaction APIs, and every test of it to stub methods it never calls. Split it into <code>AuthRepository</code>, <code>KycRepository</code>, <code>ProfileRepository</code> and <code>TransactionRepository</code> when those are genuinely separate domain responsibilities." },
    { id: "8.9", q: "D — Dependency Inversion in practice.",
      a: "<code>LoginCubit</code> depends on the <code>AuthRepository</code> abstraction; <code>FirebaseAuthRepository</code> implements it; the composition root wires the two together. Authentication technology is infrastructure, and infrastructure should be a detail the business layer is protected from. The test of whether you got it right: can the domain layer compile with no Firebase import anywhere in it?" },
    { id: "8.10", q: "Is the repository pattern the same as dependency inversion?",
      a: "No — this is a favourite trap. Repository is a pattern for abstracting data access; DIP is a principle about dependency direction. A Cubit that depends directly on <code>PaymentRepositoryImpl</code> has a repository and still violates DIP. Having the class does not mean the arrow points the right way." },
    { id: "8.11", q: "Do all repositories need an interface?",
      a: "No. An interface earns its place when it isolates infrastructure, marks a meaningful architectural boundary, supports more than one implementation, enables independent testing, or lets two parts evolve separately. Generating <code>IFooRepository</code>/<code>FooRepositoryImpl</code> pairs by reflex doubles the file count and protects nothing. With good fakes and a sane build, 'I need it for testing' is often no longer a sufficient reason on its own." },
    { id: "8.12", q: "Constructor injection vs service-locator calls — argue it concretely.",
      a: "<code>PaymentCubit(mockRepository)</code> is a complete test setup. A hidden <code>getIt&lt;PaymentRepository&gt;()</code> inside the Cubit means every test needs global registration, tests can leak state into one another, and the class's real dependencies are invisible until you read the body. Constructor dependencies are self-documenting; use the container at the composition root to build the objects." },
    { id: "8.13", q: "Composition over inheritance — why, in one answer?",
      a: "Inheritance models an is-a relationship and is right when a subtype truly satisfies the parent contract. Deep hierarchies produce tight coupling, fragile base classes and behaviour that's hard to locate. Composition assembles behaviour from explicit collaborators, so dependencies are visible, replaceable and testable. Prefer <code>PaymentCubit</code> composed of <code>AuthRepository</code>, <code>KycRepository</code> and <code>PaymentRepository</code> over a chain of BaseController subclasses." },
    { id: "8.14", q: "Can SOLID make an architecture worse?",
      a: "Yes, applied mechanically. A small feature does not need <code>IUserRepository</code>, <code>UserRepositoryImpl</code>, <code>ILoginUseCase</code>, <code>LoginUseCaseImpl</code>, <code>IUserService</code> and three data-source interfaces. SOLID exists to control coupling and reasons for change, not to maximise interface count. Introduce an abstraction where it protects a real boundary or an expected variation — and be willing to say in the interview that you've removed abstractions as well as added them." },
    { id: "8.15", q: "Where do Dart mixins fit in the composition-vs-inheritance conversation?",
      a: "A mixin is horizontal reuse — behaviour without an is-a claim — which makes it a decent middle ground for cross-cutting concerns like a logging helper or a disposal pattern. The risk is that mixins can re-create the BaseController problem quietly: stack four onto a Cubit and you again have hidden dependencies and unclear ownership, just spelled differently. Use them for stateless, self-contained behaviour; use collaborators for anything with dependencies.", added: true },
    { id: "8.16", q: "Give the staff-level summary of your position on SOLID.",
      a: "\"I treat SOLID as guidance for managing coupling and change rather than a checklist. Dependency Inversion defines the direction of dependencies; Dependency Injection is one technique for supplying them. I prefer explicit constructor injection in business classes and keep container wiring near the composition root. I add interfaces, repositories and use cases when they protect a meaningful boundary or real business semantics, not because a Clean Architecture diagram contains them.\"" }
  ]
}
];

const CHAPTERS_B = [
{
  n: 9, id: "network", title: "Networking, Authentication & Reliability",
  kicker: "Single-flight refresh, concurrent loading, and an error model the UI can act on.",
  items: [
    { id: "9.1", q: "Ten in-flight requests all return 401 at once. What happens?",
      code: "10 requests\n    ↓\n10 × 401\n    ↓\nONE refresh operation\n    ↓\nnew token\n    ↓\nretry the waiting requests",
      a: "Single-flight refresh. The first 401 starts a refresh and stores the in-progress Future; every subsequent 401 awaits that same Future rather than starting its own, then retries with the new token. Four things make it production-safe: the refresh call itself must be exempt from the interceptor so it cannot recurse; retries must be bounded (one retry per request, typically); a failed refresh must be handled centrally as a session-level transition to logged-out rather than as N independent errors; and requests queued during refresh need a timeout so a hung refresh doesn't hang the app." },
    { id: "9.2", q: "Sketch the single-flight refresh.",
      code: "Future<String>? _refreshing;\n\nFuture<String> _token() {\n  return _refreshing ??= _doRefresh()\n      .whenComplete(() => _refreshing = null);\n}\n\n// interceptor\nonError(err, handler) async {\n  if (err.response?.statusCode != 401 || err.isRefreshCall) return handler.next(err);\n  if (err.requestOptions.extra['retried'] == true) return handler.next(err);\n  try {\n    final t = await _token();\n    err.requestOptions.extra['retried'] = true;\n    handler.resolve(await _retry(err.requestOptions, t));\n  } catch (_) {\n    sessionController.expire();   // one transition, not ten errors\n    handler.next(err);\n  }\n}",
      a: "The whole trick is the nullable in-flight Future assigned with <code>??=</code> and cleared in <code>whenComplete</code>. Callers either create the refresh or join the existing one. The <code>retried</code> flag bounds retries per request; the <code>isRefreshCall</code> check prevents recursion.", added: true },
    { id: "9.3", q: "Why is a global loading boolean wrong, and what replaces it?",
      code: "Request A starts → activeRequests = 1\nRequest B starts → activeRequests = 2\nRequest A ends   → activeRequests = 1\nRequest B ends   → activeRequests = 0  → hide overlay",
      a: "With a boolean, the first request to finish hides the overlay while the second is still running. A counter incremented on start and decremented on completion is correct under concurrency. Two details to mention: decrement in a <code>finally</code> so errors don't leak the count, and consider whether a global overlay is the right UX at all — per-section loading usually is." },
    { id: "9.4", q: "What does a good error model look like?",
      code: "NetworkError\nAuthenticationError\nValidationError\nServerError\nTimeoutError\nUnknownError",
      a: "Map low-level transport failures — <code>SocketException</code>, <code>DioException</code>, status codes, parse failures — into a small domain error type at the repository boundary, and let the feature decide presentation. This keeps <code>dio</code> out of the UI layer, makes error handling exhaustively switchable, and means a transport change doesn't ripple into every screen. Carry a correlation id on the error so a user-reported issue maps to a server log line." },
    { id: "9.5", q: "How do you design retries so they help rather than hurt?",
      a: "Retry only <em>idempotent</em> operations automatically — GETs, and writes carrying an idempotency key. Use exponential backoff with jitter so a recovering backend isn't hit by a synchronised thundering herd. Bound the attempts and the total time. Never retry a 4xx other than 408/429 — the request is wrong, and repeating it won't fix it. And expose a manual retry in the UI for the cases you deliberately don't retry automatically.", added: true },
    { id: "9.6", q: "What does an interviewer expect you to say about caching at the network layer?",
      a: "Distinguish three questions: <em>correctness</em> (may this be stale, and for how long), <em>security</em> (may this touch disk at all — tokens and PII usually may not), and <em>memory</em>. Then pick per endpoint rather than globally: HTTP cache headers where the backend cooperates, an in-memory TTL for session-scoped things like KYC status, and a persisted cache only for data you're willing to render before a network call returns. Always scope cache keys to the authenticated user and clear on logout.", added: true }
  ]
},
{
  n: 10, id: "offline", title: "Offline-First & Synchronisation",
  kicker: "Read path, write path, and the conflict rules you must decide before shipping.",
  items: [
    { id: "10.1", q: "Describe the offline-first read path.",
      code: "Open screen\n    ↓\nRead local cache\n    ↓\nRender immediately\n    ↓\nFetch fresh server data\n    ↓\nUpdate local DB\n    ↓\nUI observes the update",
      a: "The local database is what the UI watches; the network is a background process that updates it. That inversion is the whole idea — the screen never waits on a socket, and there is exactly one source the UI reads from, which removes a whole class of 'which value wins' bugs." },
    { id: "10.2", q: "Describe the offline-first write path and what must be durable.",
      code: "User action\n    ↓\nPersist locally  →  PENDING\n    ↓\nSync queue\n    ↓\nServer\n    ↓\nSYNCED / FAILED",
      a: "Write locally first with a <code>PENDING</code> status and show it immediately, then enqueue it. What must be durable: the pending operations themselves (memory-only queues die with the process), a unique operation id so a replay after a lost response doesn't double-apply, a defined retry and backoff policy, defined behaviour for permanent failure (surface it and let the user act — don't retry forever silently), and conflict rules for multi-device editing." },
    { id: "10.3", q: "Compare the conflict-resolution strategies.",
      a: "<table><tr><th>Strategy</th><th>Good fit</th><th>Risk</th></tr><tr><td>Last-write-wins</td><td>Low-risk data</td><td>Silent overwrite</td></tr><tr><td>Server-wins</td><td>Central authority</td><td>Client's change disappears</td></tr><tr><td>Client-wins</td><td>Strong client ownership</td><td>Overwrites newer server state</td></tr><tr><td>Version check</td><td>Critical records</td><td>Needs real conflict handling</td></tr><tr><td>Explicit merge</td><td>Collaborative data</td><td>Most complexity</td></tr></table><p>The senior move is to pick per entity from business semantics, not one policy for the whole app: a draft note can be last-write-wins while a ledger entry needs version-based optimistic concurrency.</p>" },
    { id: "10.4", q: "How do you keep the sync queue correct when operations depend on each other?",
      a: "Order matters: 'create expense' then 'attach receipt to expense' cannot be replayed out of order, and the second references an id the server hasn't issued yet. Two workable answers — generate client-side ids (UUIDs) that the server accepts, so references are valid before sync; or make the queue a serial, ordered log per aggregate, where a failed operation blocks its own chain but not others. Say which you'd choose and why; the naive parallel-drain queue is the trap here.", added: true },
    { id: "10.5", q: "What's the biggest offline-first mistake teams make?",
      a: "Shipping the optimistic UI without the durable pending queue, the idempotency keys, and the conflict and reconciliation rules. The demo looks perfect — writes appear instantly — and the failure only shows up in production as silently lost user data, which is the hardest class of bug to even detect." }
  ]
},
{
  n: 11, id: "payments", title: "Payments & FinTech Reliability",
  kicker: "Where 'it failed' and 'I don't know' are two different answers.",
  items: [
    { id: "11.1", q: "Draw the payment state machine and explain the unusual state.",
      code: "INITIATED\n    ↓\nPROCESSING\n    ├──→ SUCCESS\n    ├──→ FAILED\n    └──→ UNKNOWN\n             ↓\n        STATUS CHECK",
      a: "<code>UNKNOWN</code> is the state most implementations are missing, and it's the one interviewers probe. A transport failure is not a business failure: a timeout means the client does not know whether money moved. Representing that honestly — rather than collapsing it to FAILED — is what makes reconciliation possible instead of double-charging." },
    { id: "11.2", q: "The user double-taps Pay. Is disabling the button enough?",
      a: "No. Disabling the button is a UX safeguard only — it does nothing about a retry after a timeout, a second device, a replayed request, or a lost response. Correctness comes from the server: give the operation a durable identity (an idempotency key generated by the client and persisted before the request goes out), have the server return the original result for a repeated key, and make transaction status queryable so the client can reconcile." },
    { id: "11.3", q: "The payment request times out. What does the app do next?",
      a: "Move to <code>UNKNOWN</code>/<code>PROCESSING</code>, not <code>FAILED</code>. Persist the transaction identity so it survives an app kill. Query the status endpoint with backoff, and reconcile before permitting any second side-effecting operation. Tell the user the truth — 'we're confirming this payment' — rather than a wrong certainty in either direction." },
    { id: "11.4", q: "Run the payment failure checklist.",
      a: "Double tap · retry after timeout · app killed mid-payment · network switch (Wi-Fi to cellular) · token expiry during the flow · backend succeeded but the response was lost · delayed provider callback · a second device acting on the same account · duplicate webhook · reconciliation after restart. Being able to list these quickly is itself the signal — it shows you've operated a payment flow rather than only built one." },
    { id: "11.5", q: "What's the client's responsibility vs the server's in payment correctness?",
      a: "The client owns: generating and persisting a durable operation identity before any network call, surviving process death with that identity, honest state representation, and reconciliation on resume. The server owns: idempotency enforcement, being the single authority on outcome, and a queryable status endpoint. Anything you can only enforce on the client is a UX improvement, not a correctness guarantee — say that sentence in the interview.", added: true }
  ]
},
{
  n: 12, id: "performance", title: "Performance & Debugging",
  kicker: "Profile, quantify, change one variable, re-measure.",
  items: [
    { id: "12.1", q: "What is your investigation workflow for a performance complaint?",
      a: "Reproduce under realistic data and on a realistic (i.e. low-end, profile-mode) device. Define the symptom precisely: startup, scrolling, animation, memory, network or battery — they have different causes. Profile with DevTools. Identify and <em>quantify</em> the bottleneck. Change one major variable at a time. Re-profile and compare. Add regression monitoring or a benchmark test where practical. The discipline matters more than any single trick." },
    { id: "12.2", q: "List the common causes of jank.",
      a: "Heavy work inside <code>build()</code> · unnecessary rebuilds · large synchronous JSON parsing · expensive layout · large image decoding · heavy CPU computation · excessive raster work · rendering too much data at once. Note they split into two buckets — UI-thread (Dart) cost and raster-thread cost — and DevTools tells you which, so the first diagnostic question is always 'which thread is over budget?'" },
    { id: "12.3", q: "A 2,000-item list is janky. Walk through it.",
      a: "Profile first, and resist the urge to name a fix. Then in order of likelihood: is it a non-lazy list (<code>Column</code> in a <code>SingleChildScrollView</code> rather than <code>ListView.builder</code>)? Is build doing work that should be precomputed — formatting, sorting, filtering per item per frame? Are images being decoded at full resolution (<code>cacheWidth</code>/<code>cacheHeight</code>, resized thumbnails)? Is layout expensive because item heights are unconstrained? Then apply lazy building, pagination, targeted rebuilds via selectors, const subtrees, <code>RepaintBoundary</code> where the rainbow overlay justifies it, and image/data optimisation." },
    { id: "12.4", q: "A 20 MB JSON response freezes the UI. What's the answer?",
      a: "Reduce the payload before you reach for concurrency — pagination, filtering, field selection, or asking the backend for a leaner shape. That is usually the real fix and it also helps battery, data and latency. If parsing genuinely must handle a large body, move it to an isolate (<code>Isolate.run</code>/<code>compute</code>), and be aware the result copy back across the port has its own cost, so return a compact structure rather than a giant object graph." },
    { id: "12.5", q: "Memory grows after navigating back and forth. How do you find it?",
      a: "Profile heap and allocations in DevTools — take a snapshot, navigate the cycle several times, snapshot again, and look at what class counts grew and what's retaining them. Then inspect the usual suspects: uncancelled stream subscriptions, undisposed controllers (Animation, Text, Scroll, Page), running timers, listeners added without removal, caches with no eviction, static references, closures capturing a State, and native resources like camera or BLE handles. Almost every Flutter leak is a missing <code>dispose</code>." },
    { id: "12.6", q: "The backend API takes 5 seconds. What's your move?",
      a: "Separate actual latency from perceived latency, and act on both. On the client: cache and render stale-while-revalidate where correctness allows, paginate, and use progressive or skeleton UI so the screen is useful before the data lands. Off the client: bring the measurement to the backend team — p50/p95 traces, which endpoint, which payload — and treat it as a shared ownership problem rather than something to paper over forever." },
    { id: "12.7", q: "What performance numbers should you actually be measuring in production?",
      a: "Frame build and raster times against the device's frame budget (p95, not average — averages hide jank), app startup to first useful frame, time-to-interactive on key screens, API latency from the client's perspective, crash-free session rate, and ANR/hang rate. The senior point: without production telemetry you're optimising a device in your hand, which is typically the fastest device your users don't have.", added: true },
    { id: "12.8", q: "What's the difference between debug, profile and release mode for performance work?",
      a: "Debug builds are JIT-compiled with assertions and service extensions enabled and can be several times slower — any performance number from a debug build is meaningless. Profile mode is AOT-compiled like release but keeps enough instrumentation for DevTools, and is the only correct mode for measuring. Release strips that instrumentation. Mentioning this unprompted is a quick credibility win.", added: true }
  ]
},
{
  n: 13, id: "native", title: "Native Integration, BLE & FFI",
  kicker: "Choosing the boundary, then making the connection resilient.",
  items: [
    { id: "13.1", q: "Match the need to the integration boundary.",
      a: "<table><tr><th>Need</th><th>Boundary</th></tr><tr><td>Invoke a native platform API</td><td>MethodChannel</td></tr><tr><td>Continuous native events</td><td>EventChannel / stream</td></tr><tr><td>Native C/C++ library interop</td><td>FFI</td></tr><tr><td>Mature package already exists</td><td>Use the package unless requirements demand custom native work</td></tr></table><p>The judgement call to voice: evaluate existing packages first, and weigh the maintenance cost of owning platform code on two OSes against what the package doesn't do.</p>" },
    { id: "13.2", q: "MethodChannel vs EventChannel vs FFI — what actually differs?",
      a: "MethodChannel is request/response, asynchronous, with messages serialised across the platform boundary — good for commands. EventChannel is a one-way native→Dart stream — good for sensor data, BLE notifications, location updates. FFI calls into a native library directly with no channel and no serialisation, which makes it far faster for high-frequency or large-data calls, but it's synchronous by default (so long calls block the isolate — use <code>Isolate.run</code> or an async FFI approach) and gives you no platform-lifecycle integration.", added: true },
    { id: "13.3", q: "BLE disconnects randomly. Design the fix.",
      code: "DISCONNECTED\n     ↓\n SCANNING\n     ↓\nCONNECTING\n     ↓\nCONNECTED  ⇄  RECONNECTING",
      a: "Model it as an explicit state machine rather than a set of booleans. Then handle each real-world cause: permissions and adapter state (Bluetooth off, location permission), OS background restrictions and app lifecycle, service rediscovery after reconnect, characteristic resubscription (subscriptions do not survive a disconnect), bounded exponential backoff so you don't spin the radio flat, and structured logging of every state transition because this is a class of bug you cannot reproduce on demand." },
    { id: "13.4", q: "What's the threading model of a platform channel, and why does it matter?",
      a: "Channel messages are handled on the platform's main/UI thread by default, so doing heavy native work inside a method-call handler blocks that thread and janks the app — dispatch it to a background queue natively and reply when done. The Dart side is always async. Also worth knowing: channel messages are serialised with a standard codec, so passing large payloads repeatedly is expensive; batch, or use FFI or shared memory for high-volume data.", added: true }
  ]
},
{
  n: 14, id: "testing", title: "Testing & Quality Engineering",
  kicker: "What to test at each layer, and the ten tests that prove you understand the system.",
  items: [
    { id: "14.1", q: "What's high-value at each test layer?",
      a: "<table><tr><th>Layer</th><th>High-value tests</th></tr><tr><td>Domain</td><td>Business rules, state transitions, edge cases</td></tr><tr><td>Repository</td><td>Caching, mapping, local/remote failure paths</td></tr><tr><td>Cubit / BLoC</td><td>Action → state sequences, concurrency, errors</td></tr><tr><td>Widget</td><td>Important UI behaviour, not pixel arrangement</td></tr><tr><td>Integration</td><td>Critical journeys and platform interactions</td></tr></table>" },
    { id: "14.2", q: "Which ten tests demonstrate you understand this system?",
      a: "Concurrent token refresh · stale search response · payment timeout → UNKNOWN · duplicate payment · offline write → sync · sync retry · conflict detection · pagination edge cases · BLE reconnect · logout during in-flight async work. Note they are all concurrency, failure and lifecycle tests — none of them assert on a widget's colour, which is the point." },
    { id: "14.3", q: "Mocks or fakes?",
      a: "Prefer fakes — a real, simple in-memory implementation of the contract — for repositories and data sources. They test behaviour rather than call sequences, so they don't break when you refactor an internal call, and a fake in-memory database catches bugs a mock never will. Reach for a mock when you specifically need to assert an interaction (the idempotency key was sent) or simulate a failure mode that's awkward to build into a fake.", added: true },
    { id: "14.4", q: "How do you test time-dependent logic — debounce, backoff, TTL?",
      a: "Inject the clock and the delay rather than calling <code>DateTime.now()</code> and <code>Future.delayed</code> directly, then in tests use <code>fakeAsync</code>/<code>FakeAsync</code> or a controllable clock to advance time instantly. Real <code>await Future.delayed</code> in tests makes the suite slow and flaky. This also quietly proves the design point that time is a dependency.", added: true },
    { id: "14.5", q: "Where do golden tests earn their keep, and where do they cost you?",
      a: "They're valuable for a design system — components, themes, dark mode, text scaling — where an unintended visual change is a real regression. They're a liability applied broadly to feature screens: they break on every copy change, font update and platform rendering difference, and teams learn to regenerate goldens without reading the diff, which is worse than having none.", added: true }
  ]
},
{
  n: 15, id: "coding", title: "Live-Coding Patterns",
  kicker: "Three problems that come up constantly, with the edge cases that get probed.",
  items: [
    { id: "15.1", q: "Implement debounced search correctly.",
      code: "Input\n  ↓\nDebounce (e.g. 300ms)\n  ↓\nRequest ID / cancellation\n  ↓\nRepository.search()\n  ↓\nOnly the latest response updates state",
      a: "Debounce cuts the number of requests; it does <strong>not</strong> guarantee response ordering, because a slow earlier request can still land after a fast later one. You need both: a timer to reduce volume, and either transport-level cancellation or a request token checked before emitting. Also handle the empty query (cancel and clear, don't search for ''), and cancel the timer in <code>close()</code>/<code>dispose()</code>." },
    { id: "15.2", q: "Implement load-more pagination, and name the edge cases.",
      code: "if (isLoading || !hasMore) return;\nisLoading = true;\nfinal nextPage = page + 1;\n\nfinal result = await repository.fetchPage(nextPage);\n\nappendDeduplicated(result.items);\npage      = nextPage;\nhasMore   = result.hasMore;\nisLoading = false;",
      a: "The guard at the top prevents concurrent page loads — a fast scroller will otherwise fire three fetches for page 2. Edge cases interviewers probe: deduplicate overlapping pages (offset pagination shifts when rows are inserted server-side — cursor pagination avoids this); keep refresh and load-more as separate operations with separate state; on failure don't discard the pages you already have — show an inline retry at the bottom; and set <code>isLoading = false</code> in a <code>finally</code> or a thrown error wedges the list permanently." },
    { id: "15.3", q: "Design an LRU + TTL cache and say what drives the parameters.",
      a: "LRU evicts the least recently used entry when capacity is exceeded — bounded memory. TTL invalidates an entry after a configured age — bounded staleness. Implement LRU with a <code>LinkedHashMap</code>: on read, remove and reinsert to move the key to the most-recent end; on write, insert and evict from the front while over capacity. Store an expiry timestamp per entry and treat an expired read as a miss. What drives the numbers is correctness, memory, freshness and security — and cache keys must be scoped to the authenticated user so data doesn't survive a logout.",
      code: "class LruTtlCache<K, V> {\n  LruTtlCache({required this.capacity, required this.ttl});\n  final int capacity;\n  final Duration ttl;\n  final _map = <K, (DateTime, V)>{};\n\n  V? get(K k) {\n    final e = _map.remove(k);\n    if (e == null) return null;\n    if (DateTime.now().difference(e.$1) > ttl) return null; // expired\n    _map[k] = e;               // reinsert = most recently used\n    return e.$2;\n  }\n\n  void put(K k, V v) {\n    _map.remove(k);\n    _map[k] = (DateTime.now(), v);\n    while (_map.length > capacity) _map.remove(_map.keys.first);\n  }\n}" },
    { id: "15.4", q: "Deduplicate concurrent identical requests — the in-flight map.",
      a: "Five widgets ask for the KYC status at the same moment; one network call should serve all five. Keep a map from request key to in-flight Future; callers either start the call or await the existing one, and the entry is removed on completion. This is the same shape as single-flight token refresh, generalised — being able to point that out is a nice moment in an interview.",
      code: "final _inFlight = <String, Future<Kyc>>{};\n\nFuture<Kyc> kyc(String userId) {\n  return _inFlight.putIfAbsent(\n    userId,\n    () => _api.fetchKyc(userId).whenComplete(() => _inFlight.remove(userId)),\n  );\n}", added: true }
  ]
}
];

const CHAPTERS_C = [
{
  n: 16, id: "scenarios", title: "Real-World Scenario Bank",
  kicker: "Eighteen scenarios. Answer each aloud in 30–90 seconds; expand only when probed.",
  items: [
    { id: "16.1", q: "Screen 3 needs to update Screen 1.",
      a: "First determine whether this is a one-time navigation result or shared business state. Use a result for the former; use a properly scoped shared state owner for the latter. Avoid direct screen-to-screen calls. <em>Key concepts: navigation result, shared state, lifecycle.</em>" },
    { id: "16.2", q: "KYC status is needed across five features.",
      a: "Use <code>KycRepository</code> as the data boundary and a <code>KycCubit</code>/BLoC if reactive state is needed. Scope it to the authenticated application lifecycle. Don't put <code>fetchKyc()</code> in a BaseController. <em>Key concepts: composition, DI, scoped state, caching.</em>" },
    { id: "16.3", q: "A user is charged twice.",
      a: "Disable the button for UX, but enforce idempotency at the server/payment boundary. Give the operation a unique durable identity and make transaction status queryable. <em>Key concepts: idempotency, distributed systems.</em>" },
    { id: "16.4", q: "The payment request times out.",
      a: "Represent the result as UNKNOWN/PROCESSING, not FAILED. Persist the transaction identity and reconcile through a status endpoint before retrying. <em>Key concepts: failure semantics, reconciliation.</em>" },
    { id: "16.5", q: "Search shows results for a query the user already changed.",
      a: "Debounce reduces request volume but does not guarantee response ordering. Use cancellation or a request/version token so only the latest response updates state. <em>Key concepts: concurrency, stale responses.</em>" },
    { id: "16.6", q: "Ten requests get 401 simultaneously.",
      a: "Single-flight refresh: one refresh operation, other requests wait, then retry safely. Bound retries and handle refresh failure centrally as a session transition. <em>Key concepts: concurrency, authentication.</em>" },
    { id: "16.7", q: "A 2,000-item list is janky.",
      a: "Profile first. Identify whether it's UI/Dart, layout, raster, images, memory or parsing. Then apply lazy lists, pagination, targeted rebuilds and data/image optimisation. <em>Key concepts: DevTools, frame performance.</em>" },
    { id: "16.8", q: "A 20 MB JSON payload freezes the UI.",
      a: "Reduce the payload first through pagination, filtering or field selection. If parsing remains CPU-heavy, move it to an isolate. <em>Key concepts: CPU vs I/O, isolates.</em>" },
    { id: "16.9", q: "Users need to create expenses offline.",
      a: "Persist locally with PENDING status and an operation ID, show it immediately, enqueue for sync, retry with backoff and reconcile with the server. <em>Key concepts: offline-first, sync, idempotency.</em>" },
    { id: "16.10", q: "Two devices edit the same record.",
      a: "Use business semantics to choose the conflict strategy. For critical records, version-based optimistic concurrency is safer than blind last-write-wins. <em>Key concepts: concurrency control, domain rules.</em>" },
    { id: "16.11", q: "You need a BLE capability no package provides.",
      a: "Evaluate existing packages first. If native APIs are required, use platform channels — MethodChannel for commands, EventChannel for continuous updates — and consider FFI for direct native-library interop. <em>Key concepts: MethodChannel, EventChannel, FFI.</em>" },
    { id: "16.12", q: "The BLE device disconnects randomly.",
      a: "Model explicit states, reconnect with bounded exponential backoff, rediscover services, resubscribe to characteristics, handle permissions and app lifecycle, and log every transition. <em>Key concepts: state machine, resilience.</em>" },
    { id: "16.13", q: "You inherit a 3,000-line BLoC.",
      a: "Don't rewrite immediately. Identify the distinct responsibilities, extract boundaries behind them, then split state ownership incrementally while product delivery continues. <em>Key concepts: refactoring, migration.</em>" },
    { id: "16.14", q: "A backend API takes five seconds.",
      a: "Separate actual latency from perceived latency. Use caching, pagination and progressive UI where correctness allows, while taking measurements to the backend team to address the real latency. <em>Key concepts: performance, cross-team ownership.</em>" },
    { id: "16.15", q: "Memory grows every time the user navigates.",
      a: "Profile heap and allocation behaviour, then inspect subscriptions, controllers, timers, listeners, caches, static references, closures and native resources. <em>Key concepts: memory, lifecycle.</em>" },
    { id: "16.16", q: "Leadership wants to rewrite the native app in Flutter.",
      a: "Compare business value, integration requirements, team capability, migration risk and incremental alternatives. Consider add-to-app rather than a big-bang rewrite. <em>Key concepts: migration, trade-offs.</em>" },
    { id: "16.17", q: "The global AppCubit has become huge.",
      a: "Split by business ownership and lifecycle. Don't recreate a God object that behaves like a BaseController with a different name. <em>Key concepts: state boundaries.</em>" },
    { id: "16.18", q: "An architecture decision you made is now failing.",
      a: "Measure the impact, communicate it transparently, compare alternatives and migrate incrementally when justified. Optimise for system outcomes, not ego. <em>Key concepts: technical leadership.</em>" }
  ]
},
{
  n: 17, id: "leadership", title: "Staff-Level Leadership Scenarios",
  kicker: "Decisions about people and process, defended with criteria rather than preference.",
  items: [
    { id: "17.1", q: "Two senior engineers disagree: BLoC vs Riverpod.",
      a: "Don't arbitrate on taste — define the decision criteria first and make the choice fall out of them: the existing codebase and migration cost, team expertise, testing story, onboarding curve, ecosystem maturity and long-term maintainability. Then decide from evidence and write the decision down (an ADR) with the reasoning, so the next person inherits the argument rather than repeating it. Also legitimate: decide that consistency matters more than the marginal difference, and keep what's already there." },
    { id: "17.2", q: "Product asks for a risky shortcut to hit a date.",
      a: "Separate immediate mitigation from durable correctness, and make the residual risk explicit and owned. 'We can ship the shortcut for launch; it means X can fail in way Y, we'll detect it via Z, and the durable fix is two weeks after' is a senior answer. Silently absorbing the risk, or refusing on principle, are both junior responses." },
    { id: "17.3", q: "Someone proposes a full rewrite.",
      a: "Quantify the actual problem in numbers, quantify the opportunity cost (what doesn't ship during the rewrite), and quantify migration risk. Then compare against incremental alternatives — strangler-fig module extraction, add-to-app, a new-code-only standard. Rewrites are occasionally right; they're rarely right at the moment they feel most attractive, which is when the team is frustrated rather than when the data supports it." },
    { id: "17.4", q: "How do you run a production incident?",
      code: "Detect\n  ↓\nAssess severity / scope\n  ↓\nMitigate          ← stop the bleeding first\n  ↓\nDiagnose\n  ↓\nFix\n  ↓\nTest\n  ↓\nStaged rollout\n  ↓\nMonitor\n  ↓\nPost-incident learning",
      a: "The ordering is the answer: mitigate before you diagnose. Roll back, feature-flag off, or force-upgrade first; understanding the root cause is not a prerequisite for stopping user harm. Afterwards, a blameless post-incident review that produces a concrete action — a test, an alert, a guardrail — rather than a document." },
    { id: "17.5", q: "The codebase has three inconsistent patterns for the same thing.",
      a: "Set a documented default for all new work, then migrate high-value areas opportunistically — when you're already touching a file, or when a module has enough churn to justify it. Forcing a big-bang consistency sweep spends weeks of delivery on something users never see, and usually stalls half-finished, leaving four patterns instead of three." },
    { id: "17.6", q: "How do you raise the bar on a team without becoming the bottleneck?",
      a: "Encode standards in things that run without you: lint rules and analyzer options, CI checks, a template module, a code-review checklist, an ADR habit. Pair and review to transfer judgement rather than to correct output. The measure of a staff engineer isn't the code they wrote — it's whether the team makes better decisions when they're on holiday.", added: true }
  ]
},
{
  n: 18, id: "rapidfire", title: "Rapid-Fire Questions",
  kicker: "One or two sentences each. Drill these until they're reflexive.",
  items: [
    { id: "18.1", q: "Why isn't debounce enough for search?",
      a: "It controls request timing, not response ordering. Add cancellation or stale-response protection." },
    { id: "18.2", q: "When should you use an isolate?",
      a: "For CPU-heavy Dart work that would otherwise block the UI isolate." },
    { id: "18.3", q: "Why is disabling a payment button insufficient?",
      a: "It's only a UX safeguard; retries and distributed behaviour still require server-side idempotency." },
    { id: "18.4", q: "What is idempotency?",
      a: "Repeating an operation with the same identity produces no unintended additional side effects." },
    { id: "18.5", q: "Should every screen have its own BLoC?",
      a: "No. State ownership should follow business responsibility, not screen count." },
    { id: "18.6", q: "Why not put KYC in BaseController?",
      a: "KYC is a domain capability; a BaseController hides dependencies and couples unrelated features." },
    { id: "18.7", q: "When is an EventBus reasonable?",
      a: "For transient events where decoupled publication is genuinely useful — never as the source of truth for state." },
    { id: "18.8", q: "How do you prevent refresh storms?",
      a: "Single-flight refresh with waiting requests and bounded retries." },
    { id: "18.9", q: "What does a payment timeout mean?",
      a: "The client doesn't know the outcome. Reconcile rather than assuming failure." },
    { id: "18.10", q: "Biggest offline-first mistake?",
      a: "Shipping without durable pending operations, idempotency and conflict/reconciliation rules." },
    { id: "18.11", q: "First step in performance work?",
      a: "Profile and identify the bottleneck. Never optimise from a guess." },
    { id: "18.12", q: "How do you split a huge BLoC?",
      a: "By business responsibility and state ownership, incrementally." },
    { id: "18.13", q: "Flutter rewrite or native migration?",
      a: "Compare business value, platform needs, team capability, risk and incremental alternatives." },
    { id: "18.14", q: "Does setState rebuild the whole screen?",
      a: "No. It marks one Element dirty and rebuilds that subtree; Flutter reconciles and repaints only what changed.", added: true },
    { id: "18.15", q: "Hot reload vs hot restart — what's the difference?",
      a: "Hot reload injects new source into the running VM and rebuilds the tree, preserving state; hot restart discards state and restarts the app. Hot reload won't pick up changes to <code>main()</code>, global/static initialisers, enum-to-class changes or native code.", added: true },
    { id: "18.16", q: "Why does Flutter use Skia/Impeller rather than native widgets?",
      a: "Because it renders its own widgets to a canvas, Flutter controls the whole pipeline — consistent behaviour across platforms and versions, and no bridge per UI operation. The trade-off is that platform look-and-feel and new OS widgets must be reimplemented rather than inherited.", added: true },
    { id: "18.17", q: "final vs const in Dart?",
      a: "<code>final</code> is set once at runtime; <code>const</code> is a compile-time constant and is canonicalised, so identical const values share one instance.", added: true },
    { id: "18.18", q: "What does late actually do, and when is it a smell?",
      a: "It defers initialisation of a non-nullable variable and throws if read before assignment. It's fine for a value initialised in <code>initState</code>; it's a smell when used to dodge making a field nullable that genuinely can be absent — you've moved a compile-time check to a runtime crash.", added: true },
    { id: "18.19", q: "Why is StatelessWidget not automatically 'faster' than StatefulWidget?",
      a: "Both are cheap immutable configuration. The cost is in what build does and what the Element subtree has to re-layout and repaint, not in which class you extended.", added: true },
    { id: "18.20", q: "What does Flutter's 'everything is a widget' actually mean for layout?",
      a: "That layout concerns are expressed compositionally — padding, alignment and constraints are widgets rather than properties. Practically it means constraints flow down, sizes flow up, and the parent positions the child; most layout bugs are a misunderstanding of that one sentence.", added: true }
  ]
},
{
  n: 19, id: "dart-lang", title: "Dart Language & Compilation",
  kicker: "Extended coverage — the language questions that sit beside the framework ones.",
  items: [
    { id: "19.1", q: "Does Dart run on a JVM? Explain JIT vs AOT.",
      a: "No. Dart's compilation strategy depends on target and build mode. In development, Flutter runs Dart on the Dart VM with JIT compilation, which is what makes hot reload possible. For production mobile and desktop builds, Dart is compiled ahead of time to native machine code for the target architecture — no VM interpretation of your business logic, and a faster startup with no warm-up. For web, Dart compiles to web targets such as JavaScript or WebAssembly depending on build configuration." },
    { id: "19.2", q: "Give the one-paragraph interview answer on compilation.",
      a: "\"Dart uses both JIT and AOT depending on the target and build mode. During development it runs on the Dart VM with JIT, which enables hot reload. For production mobile and desktop it's compiled AOT to native machine code, so it doesn't run on a JVM. For Flutter Web it targets web technologies such as JavaScript or WebAssembly.\"" },
    { id: "19.3", q: "What is sound null safety and what does 'sound' buy you?",
      a: "Nullability is part of the type: <code>String</code> can never be null, <code>String?</code> might be. Soundness means the compiler can <em>rely</em> on that — it doesn't need null checks in generated code for non-nullable types, so you get smaller and faster output as well as the correctness win. The practical consequences are flow analysis (promotion after a null check), the <code>!</code> operator as an explicit assertion you own, and <code>late</code> for deferred initialisation.", added: true },
    { id: "19.4", q: "Which Dart 3 features actually change how you write app code?",
      a: "<strong>Sealed classes</strong> plus <strong>exhaustive switch</strong> — model UI state and domain results as closed unions and let the compiler find the branch you forgot. <strong>Patterns and destructuring</strong> — readable extraction in switch expressions. <strong>Records</strong> — return two values without a throwaway class, and a clean carrier for small tuples. Together they largely remove the reason to hand-write or generate a union type for simple cases.",
      code: "// records + patterns\n(int, String) parse(String s) => (s.length, s.toUpperCase());\nfinal (len, upper) = parse('abc');\n\n// exhaustive switch over a sealed result\nfinal msg = switch (result) {\n  Ok(:final value)   => 'Got $value',\n  Failure(:final e)  => 'Failed: ${e.message}',\n};", added: true },
    { id: "19.5", q: "What's the difference between an Exception and an Error in Dart?",
      a: "By convention, <code>Exception</code> represents a condition a caller might reasonably recover from (network failure, bad input); <code>Error</code> represents a programming mistake (<code>StateError</code>, <code>ArgumentError</code>, a failed assertion) that should be fixed, not caught. Catching bare <code>Exception</code> in a repository boundary is reasonable; catching <code>Error</code> broadly usually hides a bug.", added: true },
    { id: "19.6", q: "Why does Equatable / freezed exist, and what problem does it solve?",
      a: "Dart's default <code>==</code> is identity, so two structurally identical state objects are unequal. That breaks BLoC's emit-deduplication and causes rebuilds. Equatable supplies value equality from a props list; freezed generates immutable classes with <code>copyWith</code>, value equality, unions and pattern-matching helpers. With Dart 3's sealed classes and patterns you can hand-write much of this — the trade-off is code generation build time versus boilerplate.", added: true },
    { id: "19.7", q: "What is a Dart extension, and when is it the right tool?",
      a: "It adds methods to an existing type without subclassing — <code>extension on BuildContext { ThemeData get theme => Theme.of(this); }</code>. Good for ergonomics on types you don't own. Watch out: extension methods are resolved statically, so they do not dispatch polymorphically, and two visible extensions defining the same member is an ambiguity error you resolve by hiding one at import.", added: true }
  ]
},
{
  n: 20, id: "production", title: "Production Engineering — Release, Security & Observability",
  kicker: "Extended coverage — the part of 'senior' that happens after merge.",
  items: [
    { id: "20.1", q: "How do you ship safely when you can't hotfix a mobile app instantly?",
      a: "Three layers. <strong>Feature flags / remote config</strong> so risky code can be disabled without a release — this is the real hotfix mechanism on mobile. <strong>Staged rollout</strong> through the store (1% → 10% → 50% → 100%) with crash-free rate and key funnel metrics as gates. <strong>A forced-upgrade mechanism</strong> and a minimum-supported-version check on the server for the cases where the client genuinely must be replaced. Mention that server-side kill switches are safer than any client-side cleverness.", added: true },
    { id: "20.2", q: "What observability does a Flutter app actually need?",
      a: "Crash and non-fatal error reporting wired to all three handlers (<code>FlutterError.onError</code>, <code>PlatformDispatcher.instance.onError</code>, <code>runZonedGuarded</code>); structured breadcrumb logging around key flows; performance traces for startup and critical screens; a correlation/request id shared with backend logs so one user report is traceable end-to-end; and analytics on the funnel steps that matter commercially. The senior framing: you should be able to answer 'is it broken for users right now?' without opening the app.", added: true },
    { id: "20.3", q: "What are the mobile security basics you'd be expected to name?",
      a: "Tokens in platform secure storage (Keychain / Keystore) rather than SharedPreferences; no secrets in the binary or in Dart source, because an AOT binary can be inspected; HTTPS everywhere with certificate pinning where the threat model warrants it (and a plan for rotating the pin); obfuscation and symbol upload for release builds; root/jailbreak and tamper detection as a signal rather than a guarantee; and the general principle that <em>the client is untrusted</em> — every authorisation decision must also exist on the server.", added: true },
    { id: "20.4", q: "How do you handle flavors and environments?",
      a: "Separate build flavors for dev/staging/prod with distinct application ids so they install side by side, distinct API base URLs, distinct analytics and crash projects, and compile-time configuration via <code>--dart-define</code> rather than a committed config file that can ship to the wrong environment. The failure this prevents is the classic one: a production release pointing at staging, or staging traffic polluting production analytics.", added: true },
    { id: "20.5", q: "What does a good Flutter CI pipeline run?",
      a: "Format check, <code>dart analyze</code> with a strict analysis_options, unit and widget tests with a coverage floor, build for both platforms, and golden tests for the design system. Beyond that: dependency and licence checks, app-size tracking (regressions here are invisible otherwise), and automated upload to internal distribution for every merge so QA always has today's build.", added: true },
    { id: "20.6", q: "How do you keep a Flutter app accessible, and why does it come up at senior level?",
      a: "Semantic labels on non-text controls, sufficient contrast, tap targets at the platform minimum, support for large text scale factors (test at 200% — fixed-height rows are where layouts break), focus order that makes sense, and screen-reader passes on critical journeys. It comes up at senior level because it's a requirement in many markets and it's far cheaper as a design-system property than as a retrofit.", added: true },
    { id: "20.7", q: "What drives Flutter app size, and what can you actually do about it?",
      a: "The engine is a fixed floor; beyond that it's assets (uncompressed images and fonts are usually the biggest avoidable chunk), bundled font families, native dependencies, and per-ABI code. Practical levers: split per ABI or ship an App Bundle, subset fonts, use appropriately-sized and compressed images with a remote-asset strategy for the large ones, prune unused packages, and track size in CI so a 15 MB regression is caught at review rather than at release.", added: true }
  ]
},
{

  kicker: "If asked about X, lead with Y. Read this on the way to the interview.",
  items: [
    { id: "21.1", q: "Screen communication",

  "Explain Widget / Element / RenderObject and what Keys are for.",
  "Explain the StatefulWidget lifecycle and resource cleanup.",
