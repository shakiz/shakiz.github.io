    { id: "3.1", q: "What does this print, and why?",

      a: "<code>A D C B</code>. <code>A</code> and <code>D</code> are synchronous, so they run first in source order. When the synchronous work finishes, the event loop drains the <strong>microtask queue</strong> to exhaustion before touching the event queue — so <code>C</code> runs next. <code>Future(...)</code> schedules onto the event queue, so <code>B</code> is last. The practical takeaway: a microtask that schedules another microtask can starve the event queue entirely, which is why you should not use microtasks for work that could recur." },
    { id: "3.2", q: "Does using a Future mean your work runs on another thread?",
      a: "No. This is the most commonly failed fundamentals question. A Future is a handle on a value that will exist later; the callback runs on the <em>same</em> isolate, on the same single thread, when the event loop gets to it. Asynchronous I/O and CPU-heavy work are different problems: async solves waiting, isolates solve computing." },
    { id: "3.3", q: "When do you reach for an isolate rather than a plain Future?",
      a: "<table><tr><th>Use case</th><th>Approach</th><th>Reason</th></tr><tr><td>HTTP request</td><td>Future / async-await</td><td>I/O is already asynchronous</td></tr><tr><td>Database query</td><td>Async API</td><td>Avoid blocking the UI isolate</td></tr><tr><td>Large JSON parsing</td><td>Isolate when CPU-heavy</td><td>Move computation off the UI isolate</td></tr><tr><td>Heavy computation</td><td>Isolate or native</td><td>CPU work causes dropped frames</td></tr><tr><td>Small transformation</td><td>Normal Dart</td><td>Concurrency overhead isn't free</td></tr></table>" },
    { id: "3.4", q: "Name the six async failure modes you should be able to reel off.",
      a: "<ul><li><strong>Stale response</strong> — an older request finishes after a newer one and overwrites fresh state.</li><li><strong>Duplicate request</strong> — retries or repeated taps create multiple side effects.</li><li><strong>Refresh storm</strong> — many requests independently refresh the same expired token.</li><li><strong>Lost state</strong> — critical pending work exists only in memory and dies with the process.</li><li><strong>Unbounded retry</strong> — a failure produces an infinite retry loop.</li><li><strong>Cancellation gap</strong> — a screen is gone but an async callback still targets it.</li></ul>" },
    { id: "3.5", q: "What actually crosses an isolate boundary, and what is the cost?",
      a: "Isolates don't share mutable memory; they exchange messages over ports. Most objects are deep-copied, which means sending a huge already-parsed object graph back can cost as much as the parsing you moved off-thread. Prefer to send the raw payload in and return a compact result, or use transferable byte buffers for large binary data. <code>Isolate.run</code> (and <code>compute</code> in Flutter) wrap the spawn/send/receive/kill cycle for the common one-shot case.", added: true },
    { id: "3.6", q: "How do you cancel async work in Dart when Futures aren't cancellable?",
      a: "You don't cancel the Future — you make its result irrelevant. Three standard techniques: a monotonically increasing request token that the completion handler checks before writing state; a <code>CancelToken</code>-style object that the transport layer (Dio, for example) honours by aborting the socket; and a <code>StreamSubscription</code> you can <code>cancel()</code> for stream-based work. For the token approach, compare on completion and discard non-matching results.",
      code: "int _token = 0;\n\nFuture<void> search(String q) async {\n  final t = ++_token;\n  final r = await repo.search(q);\n  if (t != _token) return; // a newer search superseded this one\n  emit(Results(r));\n}", added: true },
    { id: "3.7", q: "Stream vs Future — when does each belong, and what are the gotchas?",
      a: "A Future is one value (or one error) and completes once. A Stream is zero-to-many values over time. Gotchas that come up in review: single-subscription streams throw if listened to twice, so use <code>asBroadcastStream()</code> or a broadcast controller for fan-out; every <code>StreamSubscription</code> and <code>StreamController</code> you create must be cancelled or closed in <code>dispose()</code>, or you leak; and a broadcast stream does not replay history, so a late listener sees nothing until the next event — use a <code>BehaviorSubject</code>-style holder if consumers need the current value.", added: true },
    { id: "3.8", q: "What's the difference between async* / yield and returning a Future of a List?",
      a: "<code>async*</code> produces a lazy Stream — values are computed as the consumer pulls them, and the generator is paused between yields. Returning <code>Future&lt;List&gt;</code> computes everything before the caller sees anything. Use the generator for paged or incremental data, progress reporting, or anything you might want to stop early; use the list when the caller genuinely needs the full set atomically.", added: true },
    { id: "3.9", q: "Why can await inside a loop be a performance bug, and what's the fix?",
      a: "<code>for (final id in ids) await fetch(id);</code> serialises N round trips. If they're independent, launch them together and await the collection: <code>await Future.wait(ids.map(fetch))</code>. Caveats worth saying out loud: <code>Future.wait</code> fails fast on the first error while the others keep running (use <code>eagerError: false</code> semantics and handle per-item results), and unbounded fan-out can hammer the backend — chunk it or use a small worker pool for large N.",
      code: "// serial: N x latency\nfor (final id in ids) { await fetch(id); }\n\n// parallel, bounded\nconst limit = 6;\nfor (var i = 0; i < ids.length; i += limit) {\n  await Future.wait(ids.skip(i).take(limit).map(fetch));\n}", added: true },

{
  n: 4, id: "internals", title: "Flutter Internals — The Three Trees, Keys & Lifecycle",
  kicker: "Widget, Element, RenderObject: what each is for and why it explains everything else.",
  items: [
    { id: "4.1", q: "Explain the three trees at staff level.",
      a: "Flutter maintains three parallel trees. The <strong>Widget tree</strong> is immutable configuration — lightweight objects like <code>Scaffold</code>, <code>Column</code>, <code>Text</code> that describe what the UI should be. The <strong>Element tree</strong> is what Flutter keeps alive: each Element holds a widget's position and identity in the tree, its relationships to children, and (for a StatefulWidget) its State. The <strong>RenderObject tree</strong> does layout, sizing, positioning, painting and hit testing — <code>RenderFlex</code>, <code>RenderParagraph</code>. Not every widget creates a RenderObject, so that tree is the smallest of the three." },
    { id: "4.2", q: "Why does Flutter separate them at all?",
      a: "It splits three responsibilities that change at different rates: configuration, identity/state, and rendering. Because widgets are cheap and immutable, Flutter can throw them away and rebuild them constantly; because Elements persist, State survives those rebuilds; because RenderObjects persist and are only updated when something they care about changed, expensive layout and paint infrastructure isn't recreated every frame. Every performance and key question downstream is a consequence of this split." },
    { id: "4.3", q: "What actually happens when you call setState()?",
      a: "<code>setState</code> runs your mutation, then marks the associated Element dirty and schedules a frame. In the build phase Flutter rebuilds that Element's subtree, producing new widget objects, then reconciles them against the existing Elements — same runtimeType and key means reuse the Element and update its widget reference; otherwise unmount and inflate a new one. RenderObjects are updated only where their configuration changed, then layout and paint run for what's actually dirty. So 'setState redraws the whole screen' is wrong; it rebuilds one subtree and repaints considerably less." },
    { id: "4.4", q: "What are Keys really for?",
      a: "Keys participate in <em>reconciliation</em>: they tell Flutter which new widget corresponds to which existing Element when the child structure changes. They matter when stateful children are inserted, removed or reordered in a list — without a key, Flutter matches by position and type, so reordering two <code>TodoTile</code>s swaps their configuration but leaves their State where it was. A key is not a general performance optimisation; it solves an identity-matching problem." },
    { id: "4.5", q: "ValueKey, ObjectKey, UniqueKey, GlobalKey — when does each apply?",
      a: "<code>ValueKey</code> when a stable domain value identifies the item (an id). <code>ObjectKey</code> when identity is the object instance itself. <code>UniqueKey</code> when you deliberately want a new identity every build — i.e. force the old State to be discarded. <code>GlobalKey</code> when you need to reach an Element or State from outside its subtree, or move a subtree to a new parent while preserving State; it is expensive and a smell if used routinely for cross-widget communication.", added: true },
    { id: "4.6", q: "Walk the StatefulWidget lifecycle and say where each responsibility lives.",
      code: "createState\n   ↓\ninitState\n   ↓\ndidChangeDependencies\n   ↓\nbuild\n   ↓\ndidUpdateWidget   (when the parent rebuilds with new config)\n   ↓\nbuild\n   ↓\ndispose",
      a: "<code>initState</code> — one-time setup that needs no <code>InheritedWidget</code> lookup: controllers, initial fetch trigger. <code>didChangeDependencies</code> — anything depending on inherited data (Theme, MediaQuery, a Provider), and it re-runs when those change. <code>didUpdateWidget</code> — react to a new configuration from the parent, e.g. resubscribe when <code>widget.userId</code> changed. <code>dispose</code> — cancel every subscription, timer, listener, controller and native resource. A rebuild does not create a new State object; a new Element does." },
    { id: "4.7", q: "Why is 'a rebuild happened' not automatically a performance problem?",
      a: "Rebuilding is constructing a few immutable configuration objects; Flutter is designed to do this a lot. Frames are dropped by expensive work <em>inside</em> build, by layout that has to walk too much of the tree, by rasterisation cost, by image decode, by memory pressure or by CPU work on the UI isolate. So the rule is profile first: use DevTools to find which of those it actually is before choosing an optimisation." },
    { id: "4.8", q: "What does const actually buy you in a widget tree?",
      a: "A <code>const</code> widget is canonicalised at compile time, so the same instance is reused across rebuilds. During reconciliation Flutter can short-circuit: identical widget instance means the subtree's configuration cannot have changed, so it skips rebuilding it. That is a genuine and free win, which is why <code>prefer_const_constructors</code> is worth enforcing in lint. It does nothing for layout or raster cost.", added: true },
    { id: "4.9", q: "What is RepaintBoundary and when is it the right tool?",
      a: "It gives a subtree its own compositing layer so repainting it doesn't force its neighbours to repaint. It's correct when a small region animates continuously over expensive static content — a spinner over a complex page, a cursor, a rapidly-updating chart. It's wrong as a blanket optimisation: every boundary costs memory and a layer, and the DevTools repaint-rainbow overlay should be your evidence that you need one.", added: true },
    { id: "4.10", q: "BuildContext across an async gap — what's the bug and what's the fix?",
      a: "After <code>await</code>, the widget may have been removed from the tree; using the captured <code>context</code> to navigate or show a SnackBar can throw or act on a dead Element. Guard with <code>if (!mounted) return;</code> immediately after the await (Flutter's <code>use_build_context_synchronously</code> lint catches it). Better still, capture what you need <em>before</em> the await — <code>final messenger = ScaffoldMessenger.of(context);</code> — so you aren't depending on the tree at all afterwards.",
      code: "Future<void> save() async {\n  final messenger = ScaffoldMessenger.of(context); // capture first\n  await repo.save(draft);\n  if (!mounted) return;                            // then guard\n  messenger.showSnackBar(const SnackBar(content: Text('Saved')));\n}", added: true },
    { id: "4.11", q: "What is an InheritedWidget and why does it underpin most state libraries?",
      a: "It's a widget that exposes data down the tree and registers dependent Elements when they call <code>of(context)</code>. When it's replaced and <code>updateShouldNotify</code> returns true, Flutter rebuilds exactly those registered dependents — an O(dependents) notification rather than a tree walk. Provider, Riverpod's scope, <code>BlocProvider</code>, Theme and MediaQuery are all built on it. Knowing this lets you answer 'how does Provider actually work' without hand-waving.", added: true },
    { id: "4.12", q: "Does every widget have a RenderObject?",
      a: "No. Inherited widgets, builders, providers and most composition widgets participate in the Widget and Element trees without ever creating a RenderObject. Only <code>RenderObjectWidget</code>s (the leaf-ish ones doing real layout and paint — <code>Padding</code>'s RenderPadding, <code>Text</code>'s RenderParagraph) do." },
    { id: "4.13", q: "Give the quick mental model in one line each.",
      a: "Widget tree — <em>what should the UI be?</em> Element tree — <em>which node's identity and state survives?</em> RenderObject tree — <em>how and where does it lay out and paint?</em>" }
